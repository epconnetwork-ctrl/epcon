<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Corazón A Y A ❤️</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background: radial-gradient(circle at center,#111,#05070c);
    font-family:system-ui;
}

/* botones */
.controls{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    gap:15px;
}

button{
    padding:12px 26px;
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    background:#ff2f90;
    color:white;
}

/* escena */
#scene{
    width:100vw;
    height:100vh;
    position:relative;
}

/* partículas */
.petal{
    position:absolute;
    width:10px;
    height:10px;
    background:#ff4da6;
    border-radius:50%;
    pointer-events:none;
}

/* texto interior */
#texto{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:80px;
    font-weight:bold;
    color:white;
    letter-spacing:20px;
    opacity:0;
    transition:1s;
    text-shadow:0 0 25px #ff2f90;
}
</style>
</head>

<body>

<div class="controls">
    <button onclick="armar()">👁️ Ver</button>
    <button onclick="desarmar()">🙈 Tapar</button>
</div>

<div id="scene">
    <div id="texto">A Y A</div>
</div>

<script>
const scene = document.getElementById("scene");
const texto = document.getElementById("texto");

const TOTAL = 900;   // más partículas para forma precisa
let pieces = [];
let anim;
let flotando = true;

/* crear partículas */
for(let i=0;i<TOTAL;i++){
    const p=document.createElement("div");
    p.className="petal";

    p.x=Math.random()*innerWidth;
    p.y=Math.random()*innerHeight;

    p.style.left=p.x+"px";
    p.style.top=p.y+"px";

    scene.appendChild(p);
    pieces.push(p);
}

/* ecuación corazón */
function heart(t, scale){
    const x = 16*Math.pow(Math.sin(t),3);
    const y =
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);

    return {
        x: x*scale,
        y: -y*scale
    };
}

/* ❤️ ARMAR */
function armar(){

    flotando=false;
    cancelAnimationFrame(anim);

    const cx=innerWidth/2;
    const cy=innerHeight/2;

    pieces.forEach((p,i)=>{

        const t = (i/TOTAL)*Math.PI*2;
        const h = heart(t,14);

        const tx = cx + h.x;
        const ty = cy + h.y;

        p.x=tx;
        p.y=ty;

        p.style.transition="1.6s cubic-bezier(.2,1,.2,1)";
        p.style.left=tx+"px";
        p.style.top=ty+"px";
    });

    texto.style.opacity=1;
}

/* 💥 DESARMAR */
function desarmar(){

    texto.style.opacity=0;
    flotando=true;

    pieces.forEach(p=>{
        const a=Math.random()*Math.PI*2;
        const d=600+Math.random()*600;

        p.x=innerWidth/2+Math.cos(a)*d;
        p.y=innerHeight/2+Math.sin(a)*d;

        p.style.transition="1.8s ease-out";
        p.style.left=p.x+"px";
        p.style.top=p.y+"px";
    });

    flotar();
}

/* ✨ movimiento libre */
function flotar(){
    if(!flotando) return;

    pieces.forEach(p=>{
        p.x+=(Math.random()-.5)*1.4;
        p.y+=(Math.random()-.5)*1.4;

        p.style.left=p.x+"px";
        p.style.top=p.y+"px";
    });

    anim=requestAnimationFrame(flotar);
}

flotar();
</script>

</body>
</html>
